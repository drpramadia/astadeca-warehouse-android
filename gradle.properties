# -XX:TieredStopAtLevel=1: JDK 17 Microsoft build crash di C2 CompilerThread (EXCEPTION_ACCESS_VIOLATION 0xc0000005).
# Matikan C2 untuk stabilitas build. Upgrade path: pakai JDK Temurin/Adoptium, lalu hapus flag ini.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m -XX:TieredStopAtLevel=1
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false
